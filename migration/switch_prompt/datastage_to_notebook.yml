- role: user
  content: "DATASTAGE PARALLEL JOB: J04_Land_Stores_Employees\nDescription: Land stores + employees, derive region and headcount\nFolder: \\\\Retail_DW\\\\Pipeline\\\\1_Land\nParameters:\n  - pSrcDir (default 'C:/case_study/Source_Data'): Source files directory\n  - pStgDir (default 'C:/case_study/Staging'): Staging directory\n  - pDwhDir (default 'C:/case_study/Warehouse'): Warehouse (dimensions/facts) directory\n  - pMartDir (default 'C:/case_study/Marts'): Data mart directory\n  - pAuditDir (default 'C:/case_study/Audit'): Audit / DQ output directory\n  - pRunDate (default '2011-12-31'): Business run date (yyyy-mm-dd)\n  - pEffDate (default '2011-07-01'): SCD2 effective date for changed customer attributes (yyyy-mm-dd)\n\nSTAGE src_stores  [PxSequentialFile]\n    out link lnk_stores  <-> xfm_Store_Region\n        property selection = file\n        property rejects = continue\n        property reportProgress = yes\n        property firstLineColumnNames = firstLineColumnNames\n        property\
    \ file  = \\(2)\\(2)0\\(1)\\(3)file \\(2)#pSrcDir#/stores.csv\\(2)0\n        col StoreID sql=12 prec=255,0 nullable=0\n        col StoreName sql=12 prec=255,0 nullable=0\n        col Country sql=12 prec=255,0 nullable=0\n        col Channel sql=12 prec=255,0 nullable=0\n        col Rating sql=4 prec=10,0 nullable=0\n        col NoOfEmployees sql=4 prec=10,0 nullable=0\n\nSTAGE src_employees  [PxSequentialFile]\n    out link lnk_employees  <-> xfm_Emp_Std\n        property selection = file\n        property rejects = continue\n        property reportProgress = yes\n        property firstLineColumnNames = firstLineColumnNames\n        property file  = \\(2)\\(2)0\\(1)\\(3)file \\(2)#pSrcDir#/employees.csv\\(2)0\n        col EmployeeID sql=12 prec=255,0 nullable=0\n        col StoreID sql=12 prec=255,0 nullable=0\n        col EmployeeName sql=12 prec=255,0 nullable=0\n        col Role sql=12 prec=255,0 nullable=0\n        col HireDate sql=12 prec=255,0 nullable=0\n\nSTAGE xfm_Store_Region\
    \  [CTransformerStage]\n    in  link lnk_stores  <-> src_stores\n    out link lnk_std_store  <-> jn_Store_EmpCount\n        col store_id sql=12 prec=255,0 nullable=0  := Trim(lnk_stores.StoreID)\n        col store_name sql=12 prec=255,0 nullable=0  := Upcase(Trim(lnk_stores.StoreName))\n        col country sql=12 prec=255,0 nullable=0  := Trim(lnk_stores.Country)\n        col channel sql=12 prec=255,0 nullable=0  := Trim(lnk_stores.Channel)\n        col rating sql=4 prec=10,0 nullable=0  := lnk_stores.Rating\n        col no_of_employees sql=4 prec=10,0 nullable=0  := lnk_stores.NoOfEmployees\n        col region sql=12 prec=255,0 nullable=0  := If Trim(lnk_stores.Country) = \"United Kingdom\" Then \"UK\" Else If Trim(lnk_stores.Country) = \"EIRE\" Then \"UK&I\" Else If Trim(lnk_stores.Channel) = \"ONLINE\" Then \"ONLINE\" Else \"EUROPE_ROW\"\n\nSTAGE xfm_Emp_Std  [CTransformerStage]\n    in  link lnk_employees  <-> src_employees\n    out link lnk_std_emp  <-> cpy_Emp\n        col employee_id\
    \ sql=12 prec=255,0 nullable=0  := Trim(lnk_employees.EmployeeID)\n        col store_id sql=12 prec=255,0 nullable=0  := Trim(lnk_employees.StoreID)\n        col employee_name sql=12 prec=255,0 nullable=0  := Upcase(Trim(lnk_employees.EmployeeName))\n        col role sql=12 prec=255,0 nullable=0  := Upcase(Trim(lnk_employees.Role))\n        col hire_date sql=9 prec=10,0 nullable=0  := StringToDate(lnk_employees.HireDate, \"%yyyy-%mm-%dd\")\n        col tenure_years sql=4 prec=10,0 nullable=0  := DaysSinceFromDate(StringToDate(pRunDate, \"%yyyy-%mm-%dd\"), StringToDate(lnk_employees.HireDate, \"%yyyy-%mm-%dd\")) / 365\n\nSTAGE cpy_Emp  [PxCopy]\n    in  link lnk_std_emp  <-> xfm_Emp_Std\n    out link lnk_emp_out  <-> tgt_stg_employees\n        col employee_id sql=12 prec=255,0 nullable=0  := lnk_std_emp.employee_id\n        col store_id sql=12 prec=255,0 nullable=0  := lnk_std_emp.store_id\n        col employee_name sql=12 prec=255,0 nullable=0  := lnk_std_emp.employee_name\n        col\
    \ role sql=12 prec=255,0 nullable=0  := lnk_std_emp.role\n        col hire_date sql=9 prec=10,0 nullable=0  := lnk_std_emp.hire_date\n        col tenure_years sql=4 prec=10,0 nullable=0  := lnk_std_emp.tenure_years\n    out link lnk_emp_cnt  <-> agg_Emp_By_Store\n        col employee_id sql=12 prec=255,0 nullable=0  := lnk_std_emp.employee_id\n        col store_id sql=12 prec=255,0 nullable=0  := lnk_std_emp.store_id\n        col employee_name sql=12 prec=255,0 nullable=0  := lnk_std_emp.employee_name\n        col role sql=12 prec=255,0 nullable=0  := lnk_std_emp.role\n        col hire_date sql=9 prec=10,0 nullable=0  := lnk_std_emp.hire_date\n        col tenure_years sql=4 prec=10,0 nullable=0  := lnk_std_emp.tenure_years\n\nSTAGE agg_Emp_By_Store  [PxAggregator]\n    property method = sort\n    property key = \\(2)\\(2)0\\(1)\\(3)key\\(2)store_id\\(2)0\n    property selection = count\n    property countField = \\(2)\\(2)0\\(1)\\(3)countField\\(2)emp_cnt\\(2)0\n    in  link lnk_emp_cnt\
    \  <-> cpy_Emp\n    out link lnk_emp_by_store  <-> jn_Store_EmpCount\n        col store_id sql=12 prec=255,0 nullable=0  := lnk_emp_cnt.store_id\n        col emp_cnt sql=4 prec=10,0 nullable=0\n\nSTAGE jn_Store_EmpCount  [PxJoin]\n    property operator = innerjoin\n    property key = \\(2)\\(2)0\\(1)\\(3)key\\(2)store_id\\(2)0\n    in  link lnk_std_store  <-> xfm_Store_Region\n    in  link lnk_emp_by_store  <-> agg_Emp_By_Store\n    out link lnk_store_final  <-> tgt_stg_stores\n        col store_id sql=12 prec=255,0 nullable=0  := lnk_std_store.store_id\n        col store_name sql=12 prec=255,0 nullable=0  := lnk_std_store.store_name\n        col country sql=12 prec=255,0 nullable=0  := lnk_std_store.country\n        col channel sql=12 prec=255,0 nullable=0  := lnk_std_store.channel\n        col rating sql=4 prec=10,0 nullable=0  := lnk_std_store.rating\n        col no_of_employees sql=4 prec=10,0 nullable=0  := lnk_std_store.no_of_employees\n        col region sql=12 prec=255,0 nullable=0\
    \  := lnk_std_store.region\n        col emp_cnt sql=4 prec=10,0 nullable=0  := lnk_emp_by_store.emp_cnt\n\nSTAGE tgt_stg_stores  [PxSequentialFile]\n    in  link lnk_store_final  <-> jn_Store_EmpCount\n        property file = \\(2)\\(2)0\\(1)\\(3)file\\(2)#pStgDir#/stg_stores.csv\\(2)0\n        property append\\\\overwrite = overwrite\n        property rejects = continue\n        property firstLineColumnNames = firstLineColumnNames\n        property writemethod = \\(2)\\(2)0\\(1)\\(3)writemethod\\(2) \\(2)0\n\nSTAGE tgt_stg_employees  [PxSequentialFile]\n    in  link lnk_emp_out  <-> cpy_Emp\n        property file = \\(2)\\(2)0\\(1)\\(3)file\\(2)#pStgDir#/stg_employees.csv\\(2)0\n        property append\\\\overwrite = overwrite\n        property rejects = continue\n        property firstLineColumnNames = firstLineColumnNames\n        property writemethod = \\(2)\\(2)0\\(1)\\(3)writemethod\\(2) \\(2)0\n"
- role: assistant
  content: "dbutils.widgets.text(\"catalog\", \"\")\ndbutils.widgets.text(\"schema\", \"retail_dw\")\ndbutils.widgets.text(\"src_dir\", \"\")\ndbutils.widgets.text(\"pRunDate\", \"2011-12-31\")\ndbutils.widgets.text(\"pEffDate\", \"2011-07-01\")\ncatalog, schema, src_dir = (dbutils.widgets.get(k) for k in (\"catalog\", \"schema\", \"src_dir\"))\npRunDate, pEffDate = dbutils.widgets.get(\"pRunDate\"), dbutils.widgets.get(\"pEffDate\")\nspark.sql(f\"USE {catalog}.{schema}\")\n\n# src_stores: source file stores.csv (columns mapped by position, as DataStage does)\n_lnk_stores_raw = (spark.read.option(\"header\", \"true\").option(\"escape\", '\"')\n    .csv(f\"{src_dir}/stores.csv\"))\nassert len(_lnk_stores_raw.columns) == 6, f\"stores.csv: expected 6 columns, got {len(_lnk_stores_raw.columns)}\"\n_lnk_stores_raw = _lnk_stores_raw.toDF('StoreID', 'StoreName', 'Country', 'Channel', 'Rating', 'NoOfEmployees')\n_lnk_stores_raw.createOrReplaceTempView(\"_lnk_stores_raw\")\nlnk_stores = spark.sql(f\"\
    \"\"SELECT\n  coalesce(`StoreID`, '') AS StoreID,\n  coalesce(`StoreName`, '') AS StoreName,\n  coalesce(`Country`, '') AS Country,\n  coalesce(`Channel`, '') AS Channel,\n  CAST(`Rating` AS int) AS Rating,\n  CAST(`NoOfEmployees` AS int) AS NoOfEmployees\nFROM _lnk_stores_raw\"\"\")\nlnk_stores.createOrReplaceTempView(\"lnk_stores\")\n\n# src_employees: source file employees.csv (columns mapped by position, as DataStage does)\n_lnk_employees_raw = (spark.read.option(\"header\", \"true\").option(\"escape\", '\"')\n    .csv(f\"{src_dir}/employees.csv\"))\nassert len(_lnk_employees_raw.columns) == 5, f\"employees.csv: expected 5 columns, got {len(_lnk_employees_raw.columns)}\"\n_lnk_employees_raw = _lnk_employees_raw.toDF('EmployeeID', 'StoreID', 'EmployeeName', 'Role', 'HireDate')\n_lnk_employees_raw.createOrReplaceTempView(\"_lnk_employees_raw\")\nlnk_employees = spark.sql(f\"\"\"SELECT\n  coalesce(`EmployeeID`, '') AS EmployeeID,\n  coalesce(`StoreID`, '') AS StoreID,\n  coalesce(`EmployeeName`,\
    \ '') AS EmployeeName,\n  coalesce(`Role`, '') AS Role,\n  coalesce(`HireDate`, '') AS HireDate\nFROM _lnk_employees_raw\"\"\")\nlnk_employees.createOrReplaceTempView(\"lnk_employees\")\n\n# xfm_Store_Region: Transformer\nlnk_std_store = spark.sql(f\"\"\"\nSELECT\n  CAST(trim(StoreID) AS string) AS store_id,\n  CAST(upper(trim(StoreName)) AS string) AS store_name,\n  CAST(trim(Country) AS string) AS country,\n  CAST(trim(Channel) AS string) AS channel,\n  Rating AS rating,\n  NoOfEmployees AS no_of_employees,\n  CAST(CASE WHEN (trim(Country) = 'United Kingdom') THEN 'UK' ELSE CASE WHEN (trim(Country) = 'EIRE') THEN 'UK&I' ELSE CASE WHEN (trim(Channel) = 'ONLINE') THEN 'ONLINE' ELSE 'EUROPE_ROW' END END END AS string) AS region\nFROM lnk_stores\n\"\"\")\nlnk_std_store.createOrReplaceTempView(\"lnk_std_store\")\n\n# xfm_Emp_Std: Transformer\nlnk_std_emp = spark.sql(f\"\"\"\nSELECT\n  CAST(trim(EmployeeID) AS string) AS employee_id,\n  CAST(trim(StoreID) AS string) AS store_id,\n  CAST(upper(trim(EmployeeName))\
    \ AS string) AS employee_name,\n  CAST(upper(trim(Role)) AS string) AS role,\n  CAST(to_date(HireDate, 'yyyy-MM-dd') AS date) AS hire_date,\n  CAST((datediff(to_date('{pRunDate}', 'yyyy-MM-dd'), to_date(HireDate, 'yyyy-MM-dd')) / 365) AS int) AS tenure_years\nFROM lnk_employees\n\"\"\")\nlnk_std_emp.createOrReplaceTempView(\"lnk_std_emp\")\n\n# cpy_Emp: Copy\nlnk_emp_out = spark.sql(f\"\"\"\nSELECT * FROM lnk_std_emp\n\"\"\")\nlnk_emp_out.createOrReplaceTempView(\"lnk_emp_out\")\n\n# cpy_Emp: Copy\nlnk_emp_cnt = spark.sql(f\"\"\"\nSELECT * FROM lnk_std_emp\n\"\"\")\nlnk_emp_cnt.createOrReplaceTempView(\"lnk_emp_cnt\")\n\n# agg_Emp_By_Store: Aggregator\nlnk_emp_by_store = spark.sql(f\"\"\"\nSELECT store_id, CAST(COUNT(*) AS int) AS emp_cnt\nFROM lnk_emp_cnt\nGROUP BY store_id\n\"\"\")\nlnk_emp_by_store.createOrReplaceTempView(\"lnk_emp_by_store\")\n\n# jn_Store_EmpCount: Join (inner) on store_id\nlnk_store_final = spark.sql(f\"\"\"\nSELECT\n  l.store_id,\n  l.store_name,\n  l.country,\n\
    \  l.channel,\n  l.rating,\n  l.no_of_employees,\n  l.region,\n  r.emp_cnt\nFROM lnk_std_store l\nINNER JOIN lnk_emp_by_store r ON l.store_id = r.store_id\n\"\"\")\nlnk_store_final.createOrReplaceTempView(\"lnk_store_final\")\n\n# tgt_stg_stores: write Delta table stg_stores\n(lnk_store_final.select('store_id', 'store_name', 'country', 'channel', 'rating', 'no_of_employees', 'region', 'emp_cnt').write.mode(\"overwrite\")\n    .option(\"overwriteSchema\", \"true\").saveAsTable(f\"{catalog}.{schema}.stg_stores\"))\nprint(\"stg_stores:\", spark.table(f\"{catalog}.{schema}.stg_stores\").count(), \"rows\")\n\n# tgt_stg_employees: write Delta table stg_employees\n(lnk_emp_out.select('employee_id', 'store_id', 'employee_name', 'role', 'hire_date', 'tenure_years').write.mode(\"overwrite\")\n    .option(\"overwriteSchema\", \"true\").saveAsTable(f\"{catalog}.{schema}.stg_employees\"))\nprint(\"stg_employees:\", spark.table(f\"{catalog}.{schema}.stg_employees\").count(), \"rows\")\n"
- role: user
  content: "DATASTAGE PARALLEL JOB: J15_Analysis_CustomerType_Profit\nDescription: Q2: which customer type (citizen/foreign) generates the highest profit\nFolder: \\\\Retail_DW\\\\Pipeline\\\\4_Marts\nParameters:\n  - pSrcDir (default 'C:/case_study/Source_Data'): Source files directory\n  - pStgDir (default 'C:/case_study/Staging'): Staging directory\n  - pDwhDir (default 'C:/case_study/Warehouse'): Warehouse (dimensions/facts) directory\n  - pMartDir (default 'C:/case_study/Marts'): Data mart directory\n  - pAuditDir (default 'C:/case_study/Audit'): Audit / DQ output directory\n  - pRunDate (default '2011-12-31'): Business run date (yyyy-mm-dd)\n  - pEffDate (default '2011-07-01'): SCD2 effective date for changed customer attributes (yyyy-mm-dd)\n\nSTAGE src_mart  [PxSequentialFile]\n    out link lnk_mart  <-> agg_By_Type\n        property selection = file\n        property rejects = continue\n        property reportProgress = yes\n        property firstLineColumnNames = firstLineColumnNames\n\
    \        property file  = \\(2)\\(2)0\\(1)\\(3)file \\(2)#pMartDir#/RETAIL_DATA_MART.csv\\(2)0\n        col invoice_no sql=12 prec=255,0 nullable=0\n        col stock_code sql=12 prec=255,0 nullable=0\n        col quantity sql=4 prec=10,0 nullable=0\n        col invoice_ts sql=11 prec=26,0 nullable=0\n        col unit_price sql=3 prec=18,2 nullable=0\n        col customer_id sql=4 prec=10,0 nullable=0\n        col country sql=12 prec=255,0 nullable=0\n        col store_id sql=12 prec=255,0 nullable=0\n        col invoice_date_key sql=4 prec=10,0 nullable=0\n        col year_month sql=12 prec=255,0 nullable=0\n        col customer_sk sql=4 prec=10,0 nullable=0\n        col customer_type sql=12 prec=255,0 nullable=0\n        col loyalty_tier sql=12 prec=255,0 nullable=0\n        col category sql=12 prec=255,0 nullable=0\n        col product_sk sql=4 prec=10,0 nullable=0\n        col region sql=12 prec=255,0 nullable=0\n        col store_sk sql=4 prec=10,0 nullable=0\n        col employee_sk\
    \ sql=4 prec=10,0 nullable=0\n        col currency sql=12 prec=255,0 nullable=0\n        col sales_amount sql=3 prec=18,2 nullable=0\n        col cost_amount sql=3 prec=18,2 nullable=0\n        col gross_profit sql=3 prec=18,2 nullable=0\n        col local_amount sql=3 prec=18,2 nullable=0\n        col line_cnt sql=4 prec=10,0 nullable=0\n        col cust_name sql=12 prec=255,0 nullable=0\n        col gender sql=12 prec=255,0 nullable=0\n        col age sql=4 prec=10,0 nullable=0\n        col spending_score sql=4 prec=10,0 nullable=0\n        col annual_income_k sql=4 prec=10,0 nullable=0\n        col product_name sql=12 prec=255,0 nullable=0\n        col list_price sql=3 prec=18,2 nullable=0\n        col store_name sql=12 prec=255,0 nullable=0\n        col rating sql=4 prec=10,0 nullable=0\n        col no_of_employees sql=4 prec=10,0 nullable=0\n\nSTAGE agg_By_Type  [PxAggregator]\n    property method = sort\n    property key = \\(2)\\(2)0\\(1)\\(3)key\\(2)customer_type\\(2)0\n    property\
    \ selection = reduce\n    property reduce = \\(2)\\(2)0\\(1)\\(3)reduce\\(2)gross_profit\\(2)0\\(1)\\(3)\\(3)sum\\(2)profit_total\\(2)0\\(1)\\(3)reduce\\(2)sales_amount\\(2)0\\(1)\\(3)\\(3)sum\\(2)sales_total\\(2)0\\(1)\\(3)reduce\\(2)line_cnt\\(2)0\\(1)\\(3)\\(3)sum\\(2)lines\\(2)0\n    in  link lnk_mart  <-> src_mart\n    out link lnk_by_type  <-> srt_Profit\n        col customer_type sql=12 prec=255,0 nullable=0  := lnk_mart.customer_type\n        col profit_total sql=3 prec=18,2 nullable=0\n        col sales_total sql=3 prec=18,2 nullable=0\n        col lines sql=-5 prec=19,0 nullable=0\n\nSTAGE srt_Profit  [PxSort]\n    property operator = psort -sorter unix\n    property key = \\(2)\\(2)0\\(1)\\(3)key\\(2)profit_total\\(2)0\\(1)\\(3)\\(3)asc\\\\desc\\(2)desc\\(2)0\n    in  link lnk_by_type  <-> agg_By_Type\n    out link lnk_ranked  <-> cpy_Ranked\n        col customer_type sql=12 prec=255,0 nullable=0  := lnk_by_type.customer_type\n        col profit_total sql=3 prec=18,2 nullable=0\
