[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[project]
name = "lakebridge-workflow"
version = "0.1.0"
description = "Repository-aware Lakebridge analyzer, hierarchy, planning, and migration workflow"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Retail DW migration maintainers" }]
keywords = ["databricks", "lakebridge", "datastage", "migration", "etl"]

[project.scripts]
lakebridge-workflow = "lakebridge_workflow.__main__:main"
