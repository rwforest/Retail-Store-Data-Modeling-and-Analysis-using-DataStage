bundle:
  name: retail_dw_migration_sdp

variables:
  catalog:
    description: Unity Catalog catalog that holds the migrated tables
  schema:
    default: retail_dw_sdp
  src_dir:
    description: UC volume path holding the Source_Data CSVs

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      profile: DEFAULT
    variables:
      catalog: unitygo
      schema: retail_dw_sdp
      src_dir: /Volumes/unitygo/retail_dw/landing
