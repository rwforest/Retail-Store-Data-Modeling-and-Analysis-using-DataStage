        - task_key: J18_Mart_Product_Performance
          depends_on:
            - task_key: J11_Fact_Returns
            - task_key: J12_Fact_Invoice
          notebook_task:
            notebook_path: ../src/notebooks/J18_Mart_Product_Performance.py
            base_parameters:
              catalog: '{{job.parameters.catalog}}'
              schema: '{{job.parameters.schema}}'
              src_dir: '{{job.parameters.src_dir}}'
              pRunDate: '{{job.parameters.pRunDate}}'
              pEffDate: '{{job.parameters.pEffDate}}'
        - task_key: J19_Mart_Basket_Affinity
          depends_on:
            - task_key: J11_Fact_Returns
            - task_key: J12_Fact_Invoice
          notebook_task:
            notebook_path: ../src/notebooks/J19_Mart_Basket_Affinity.py
            base_parameters:
