              pEffDate: '{{job.parameters.pEffDate}}'
        - task_key: J14_Analysis_Employee_Transactions
          depends_on:
            - task_key: J13_Mart_RETAIL_DATA_MART
          notebook_task:
            notebook_path: ../src/notebooks/J14_Analysis_Employee_Transactions.py
            base_parameters:
              catalog: '{{job.parameters.catalog}}'
              schema: '{{job.parameters.schema}}'
              src_dir: '{{job.parameters.src_dir}}'
              pRunDate: '{{job.parameters.pRunDate}}'
              pEffDate: '{{job.parameters.pEffDate}}'
        - task_key: J15_Analysis_CustomerType_Profit
          depends_on:
            - task_key: J13_Mart_RETAIL_DATA_MART
          notebook_task:
            notebook_path: ../src/notebooks/J15_Analysis_CustomerType_Profit.py
            base_parameters:
              catalog: '{{job.parameters.catalog}}'
